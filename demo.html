<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Persian Datepicker v3 — دمو و پیش‌نمایش</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./datepicker.bundle.css" />
  <link rel="stylesheet" href="./packages/core/styles/datepicker.css" />
  <style>
    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 24px;
      direction: rtl;
    }
    h1 { color: #1976d2; margin-bottom: 6px; }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 28px;
      max-width: 1200px;
      margin: 20px auto 0;
    }
    .demo-card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    .value-display {
      margin-top: 12px;
      padding: 8px 12px;
      background: #f0f4ff;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #1976d2;
      font-family: monospace;
      min-height: 32px;
      direction: ltr;
    }
  </style>
</head>
<body>

<h1>📅 Persian Datepicker v3</h1>
<p>پشتیبانی کامل از سوئیچر تقویم، تقویم جلالی، میلادی، هجری قمری و کلاس SmartDate</p>

<div class="demo-grid">
  <div class="demo-card">
    <h3>تقویم با امکان تغییر تقویم (Calendar Switcher)</h3>
    <div id="dp-jalali"></div>
    <div class="value-display" id="val-jalali">—</div>
  </div>

  <div class="demo-card">
    <h3>بازه تاریخی (Range Mode)</h3>
    <div id="dp-range"></div>
    <div class="value-display" id="val-range">—</div>
  </div>

  <div class="demo-card">
    <h3>چند تاریخ (Multiple Mode)</h3>
    <div id="dp-multi"></div>
    <div class="value-display" id="val-multi">—</div>
  </div>

  <div class="demo-card">
    <h3>تاریخ و ساعت (Date & Time Picker)</h3>
    <div id="dp-datetime"></div>
    <div class="value-display" id="val-datetime">—</div>
  </div>

  <div class="demo-card" style="background:#1e1e1e; color:#e0e0e0; border-color:#333;">
    <h3 style="color:#90caf9;">Dark Theme</h3>
    <div id="dp-dark"></div>
    <div class="value-display" id="val-dark" style="background:#2d2d2d; color:#90caf9;">—</div>
  </div>

  <div class="demo-card">
    <h3>Inline — تقویم توکار</h3>
    <div id="dp-inline"></div>
    <div class="value-display" id="val-inline">—</div>
  </div>
</div>

<script src="./datepicker.bundle.js"></script>
<script type="module">
  let DatePicker;
  if (window.MyDatepickerCore) {
    DatePicker = window.MyDatepickerCore.DatePicker;
  } else {
    const mod = await import('./packages/core/src/index.ts');
    DatePicker = mod.DatePicker;
  }

  const dpJalali = new DatePicker('#dp-jalali', {
    calendar: 'jalali',
    calendarSwitcher: true,
    value: new Date(),
    pattern: 'l j F Y',
  });
  const updateJalaliDisplay = (val) => {
    const el = document.getElementById('val-jalali');
    if (el) el.textContent = val ? JSON.stringify(val) : '—';
  };
  updateJalaliDisplay(dpJalali.getValue());
  dpJalali.on('change', ({ value }) => {
    updateJalaliDisplay(value);
  });
  dpJalali.on('calendar-change', () => {
    updateJalaliDisplay(dpJalali.getValue());
  });

  const dpRange = new DatePicker('#dp-range', {
    mode: 'range',
    calendar: 'jalali',
  });
  dpRange.on('change', ({ value }) => {
    document.getElementById('val-range').textContent = JSON.stringify(value);
  });

  const dpMulti = new DatePicker('#dp-multi', {
    mode: 'multiple',
    calendar: 'jalali',
  });
  dpMulti.on('change', ({ value }) => {
    document.getElementById('val-multi').textContent = JSON.stringify(value);
  });

  const dpDateTime = new DatePicker('#dp-datetime', {
    calendar: 'jalali',
    showTime: true,
  });
  dpDateTime.on('change', ({ value }) => {
    document.getElementById('val-datetime').textContent = JSON.stringify(value);
  });

  const dpDark = new DatePicker('#dp-dark', {
    theme: 'dark',
    calendar: 'jalali',
  });
  dpDark.on('change', ({ value }) => {
    document.getElementById('val-dark').textContent = JSON.stringify(value);
  });

  const dpInline = new DatePicker('#dp-inline', {
    inline: true,
    calendar: 'jalali',
  });
  dpInline.on('change', ({ value }) => {
    document.getElementById('val-inline').textContent = JSON.stringify(value);
  });
</script>

</body>
</html>
